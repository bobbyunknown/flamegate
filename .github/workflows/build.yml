name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release (e.g. v0.2.0, v0.2.0-beta.1)"
        required: false
        default: ""
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend
        run: |
          cd frontend
          bun install
          bun run build

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: frontend/dist/
          retention-days: 1

  build:
    needs: [frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jobs:
          # Standard 6 Architectures
          - { goos: darwin, goarch: arm64, output: darwin-arm64 }
          - { goos: darwin, goarch: amd64, output: darwin-amd64 }
          - { goos: linux, goarch: amd64, output: linux-amd64, test: test }
          - { goos: linux, goarch: arm64, output: linux-arm64 }
          - { goos: windows, goarch: amd64, output: windows-amd64 }
          - { goos: windows, goarch: arm64, output: windows-arm64 }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Download frontend assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-assets
          path: internal/infrastructure/http/static/dist

      - name: Ensure embed directory exists
        run: |
          mkdir -p internal/infrastructure/http/static/dist
          touch internal/infrastructure/http/static/dist/.gitkeep

      - name: Set Build Variables
        id: vars
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="nightly-${SHORT_SHA}"
          fi
          
          BUILDTIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          COMMIT="$(git rev-parse HEAD)"
          
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "BUILDTIME=${BUILDTIME}" >> $GITHUB_ENV
          echo "COMMIT=${COMMIT}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
        shell: bash

      - name: Run Tests
        if: ${{ matrix.jobs.test == 'test' }}
        run: |
          go test -v ./...
          go vet ./... ./cmd/...

      - name: Build binary
        env:
          GOOS: ${{ matrix.jobs.goos }}
          GOARCH: ${{ matrix.jobs.goarch }}
          CGO_ENABLED: 0
        run: |
          OUTPUT_NAME="flamegate-${{ matrix.jobs.output }}"
          LDFLAGS="-X 'main.Version=${VERSION}' -X 'main.Commit=${SHORT_SHA}' -X 'main.BuildTime=${BUILDTIME}' -w -s -buildid="
          
          if [ "${{ matrix.jobs.goos }}" = "windows" ]; then
            BIN_NAME="${OUTPUT_NAME}-${VERSION}.exe"
            go build -trimpath -ldflags "${LDFLAGS}" -o "${BIN_NAME}" ./cmd/flamegate
          else
            BIN_NAME="${OUTPUT_NAME}-${VERSION}"
            go build -trimpath -ldflags "${LDFLAGS}" -o "${BIN_NAME}" ./cmd/flamegate
            chmod +x "${BIN_NAME}"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "binary-${{ matrix.jobs.output }}"
          path: |
            flamegate-*
          retention-days: 7

  Upload-Nightly:
    permissions:
      contents: write
    if: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.event_name, 'pull_request') && !startsWith(github.ref, 'refs/tags/v') }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "binary-*"
          path: bin/
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd bin/
          find . -maxdepth 1 -type f -name "flamegate-*" | sort | xargs sha256sum > checksums.txt
          cat checksums.txt
        shell: bash

      - name: Create / Update Nightly Prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "nightly"
          prerelease: true
          files: |
            bin/flamegate-*
            bin/checksums.txt
          generate_release_notes: true
          body: |
            ### FlameGate Continuous Nightly Build
            - **Branch:** `main`
            - **Commit:** `${{ github.sha }}`
            - **Built At:** `${{ github.event.head_commit.timestamp || 'now' }}`

  Upload-Release:
    permissions:
      contents: write
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') || startsWith(github.ref, 'refs/tags/v') }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag & Prerelease Flag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          
          if [[ "${TAG}" == *"-alpha"* || "${TAG}" == *"-beta"* || "${TAG}" == *"-rc"* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "binary-*"
          path: bin/
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd bin/
          find . -maxdepth 1 -type f -name "flamegate-*" | sort | xargs sha256sum > checksums.txt
          cat checksums.txt
        shell: bash

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            bin/flamegate-*
            bin/checksums.txt
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true

  Docker:
    permissions:
      contents: read
      packages: write
    if: ${{ !startsWith(github.event_name, 'pull_request') }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/flamegate', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
